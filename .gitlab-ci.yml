image: oven/bun:1.3.14-alpine

stages: [validate, build, integration]

default:
  tags:
    - kubernetes
  cache:
    key:
      files: [bun.lock]
    paths: [.bun/install/cache]

validate:
  stage: validate
  script:
    - bun install --frozen-lockfile
    - bun run typecheck
    - bun run lint
    - bun test
    - bun audit

build:
  stage: build
  needs: [validate]
  script:
    - bun install --frozen-lockfile
    - bun run build
    - bun run scripts/package-smoke.ts
    - bun run scripts/tui-smoke.ts
  artifacts:
    expire_in: 7 days
    paths: [dist/]

hosted-smoke:
  stage: integration
  needs: [validate]
  services:
    - name: redis:7.4-alpine
      alias: redis
  variables:
    REDIS_URL: redis://redis:6379
  script:
    - bun install --frozen-lockfile
    - bun run verify:hosted
