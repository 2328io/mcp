name: mcp-2328-production

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  caddy:
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env.production}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - edge
    depends_on:
      mcp:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.50
    logging: *default-logging

  mcp:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      TRANSPORT: http
      HOST: 0.0.0.0
      PORT: "3000"
      PUBLIC_BASE_URL: https://mcp.2328.io
      MCP_PATH: /mcp
      API_BASE_URL: https://api.2328.io/api/v1
      API_TIMEOUT_MS: "8000"
      REDIS_URL: redis://mcp@redis:6379
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      TOKEN_ENCRYPTION_KEY_FILE: /run/secrets/token_encryption_key
      ACCESS_TOKEN_TTL_SECONDS: "900"
      REFRESH_TOKEN_TTL_SECONDS: "2592000"
      AUTH_CODE_TTL_SECONDS: "120"
      PREPARATION_TTL_SECONDS: "300"
      CONVERT_PREPARATION_TTL_SECONDS: "60"
      MCP_RATE_LIMIT_PER_MINUTE: ${MCP_RATE_LIMIT_PER_MINUTE:-600}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      TRUST_PROXY: "true"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    secrets:
      - redis_password
      - token_encryption_key
    expose:
      - "3000"
    networks:
      - edge
      - state
    depends_on:
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 512m
    cpus: 1.00
    logging: *default-logging

  redis:
    image: redis:7.4-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    restart: unless-stopped
    command:
      - redis-server
      - --aclfile
      - /run/secrets/redis_acl
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --save
      - "60"
      - "1"
      - --maxmemory-policy
      - noeviction
    secrets:
      - redis_acl
      - redis_password
    volumes:
      - redis-data:/data
    networks:
      - state
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$(cat /run/secrets/redis_password) redis-cli --user mcp ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETGID, SETUID]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.50
    logging: *default-logging

networks:
  edge:
  state:
    internal: true

volumes:
  caddy-data:
  caddy-config:
  redis-data:

secrets:
  redis_acl:
    file: ./secrets/redis.acl
  redis_password:
    file: ./secrets/redis_password
  token_encryption_key:
    file: ./secrets/token_encryption_key
